[project]
name = "marp-inference-worker"
version = "0.1.0"
description = "Agnostic MARP inference worker service."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "ultralytics",
    "psutil",
    "nvidia-ml-py",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100