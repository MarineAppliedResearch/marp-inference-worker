<!DOCTYPE html>
<!--
  live.html
  Created: 2026-09-17
  Author: Isaac Travers

  The watch window's only page. Asks the worker's loopback server for the next
  frame, draws it, draws the tracker's boxes over it, and acknowledges so the
  next one is released.

  This file lives in the worker package rather than in the player host the
  installer stages. It was missing from both for the whole life of the feature:
  `WatchDisplay.start()` refuses without it, so the window had never once opened
  on any machine, and the failure went to a coordinator log event where nobody
  could see it. Shipping it beside the code that serves it is what stops that
  happening again -- there is no build step that can omit it now.

  It deliberately does not use marp-video-player. That player seeks a video; this
  draws frames the worker has already decoded and pushes over loopback, which is
  a different job and a much smaller one.
-->
<meta charset="utf-8">
<title>MARP · watching inference</title>
<!--
  The window's own icon, and the taskbar entry's. A Chromium `--app` window
  takes both from the page's favicon, so this one line is what puts the MARP
  mark on the window somebody sees running on a donated machine. Served from
  this package by the display server, for the same reason the page itself is:
  a file that only exists in an installer payload is a file that is missing
  from a git checkout, which is how the watch window never ran at all.
-->
<link rel="icon" type="image/png" href="marp-mark.png">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #0b0f14; color: #e6edf3;
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden;
  }
  #stage {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
  }
  canvas { max-width: 100%; max-height: 100%; background: #000; }
  #bar {
    position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px;
    display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
    background: linear-gradient(#0b0f14e6, #0b0f1400);
    pointer-events: none;
  }
  #bar b { font-weight: 600; color: #fff; }
  #bar span { color: #9fb0c0; }
  /* The whole-machine rate is the quieter of the two: this window's own rate is
     what somebody watching this window wants first. */
  #bar .all { color: #7f8fa0; }
  #bar .all b { color: #c9d6e2; font-weight: 500; }
  #count { color: #7ee787; font-variant-numeric: tabular-nums; }
  #frame { font-variant-numeric: tabular-nums; }
  #note {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #9fb0c0; text-align: center;
  }
  /* The timeline, along the bottom. It answers "where in the video is this,
     and how much is left", which the 3-pixel bar it replaces could not: that
     bar drew a fraction of a range nobody could see the bounds of.
     Its height is a variable because the footer and the watermark stack on
     top of it, and three numbers that disagree is how a watermark ends up
     sitting over a label. */
  :root { --timeline-h: 36px; }
  #timeline {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 6px 10px 7px; background: #0b0f14ee;
    font-size: 10px; line-height: 1.3; color: #8b9bab;
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  /* The whole video, when the container will say how long it is. */
  #tltrack {
    position: relative; height: 8px; border-radius: 4px; background: #16202b;
  }
  /* The slice of it this job owns. */
  #tlwindow { position: absolute; top: 0; bottom: 0; background: #1f3350; border-radius: 4px; }
  /* What an earlier attempt already covered, before this one was handed the
     rest. Dimmer than this attempt's fill, because it is somebody else's
     work and this window did not watch it happen. */
  #tlearlier { position: absolute; top: 0; bottom: 0; background: #2f81f74d; }
  /* Where this attempt picked the job up. Shading alone is too quiet a signal
     for the thing the timeline exists to say -- that the frames behind the
     playhead were somebody else's run and not frames this one skipped. */
  #tlstart {
    position: absolute; top: -3px; bottom: -3px; width: 1px;
    margin-left: -1px; background: #8b9bab; display: none;
  }
  /* What this attempt has done. */
  #tlfill { position: absolute; top: 0; bottom: 0; background: #2f81f7; }
  /* The playhead. The same green as the track count above, which is the
     colour this page already uses for "now". */
  #tlhead {
    position: absolute; top: -3px; bottom: -3px; width: 2px;
    margin-left: -1px; background: #7ee787; border-radius: 1px;
  }
  #tllegend { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
  #tllegend .mid { color: #c9d6e2; }
  /* The footer. Deliberately small: it is provenance for somebody glancing at
     a donated machine, not a dashboard. It sits above the progress bar rather
     than over the video, so it never hides an organism. */
  #footer {
    position: absolute; left: 0; right: 0; bottom: var(--timeline-h); padding: 4px 10px;
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
    font-size: 10px; line-height: 1.3; color: #8b9bab;
    background: linear-gradient(#0b0f1400, #0b0f14e6);
    pointer-events: none; font-variant-numeric: tabular-nums;
  }
  #footer .k { color: #5f6f7f; }
  #footer .v { color: #c9d6e2; }
  #footer .sep { color: #33414f; }
  /* The watermark. Bottom left, above the footer, faint enough to read the
     video through and large enough to recognise across a room. Never over the
     centre of frame, where the animals are. */
  #mark {
    position: absolute; left: 12px; bottom: calc(var(--timeline-h) + 23px);
    /* The mark is near square (599x525), not the wide wordmark -- a wordmark
       shrunk into a taskbar slot is an illegible smear, and the M reads at any
       size. Sized so it stays small in a quarter-screen tile. */
    width: 58px; opacity: 0.3;
    pointer-events: none; user-select: none;
    filter: drop-shadow(0 1px 2px #000a);
  }
</style>

<div id="stage"><canvas id="view" width="16" height="9"></canvas></div>
<div id="bar">
  <span><b id="fps">–</b> fps</span>
  <span class="all"><b id="fpsall">–</b> fps all slots</span>
  <span id="job"></span>
  <span>frame <b id="frame">–</b></span>
  <span id="count"></span>
</div>
<div id="note">waiting for the first frame…</div>
<img id="mark" src="marp-mark.png" alt="MARP">
<div id="footer">
  <span><span class="k">gpu</span> <span class="v" id="gpu">–</span></span>
  <span><span class="k">net</span> <span class="v" id="net">–</span></span>
  <span class="sep">|</span>
  <span><span class="k">project</span> <span class="v" id="project">–</span></span>
  <span><span class="k">dive</span> <span class="v" id="dive">–</span></span>
  <span><span class="k">line</span> <span class="v" id="line">–</span></span>
  <span><span class="k">type</span> <span class="v" id="stype">–</span></span>
  <span class="sep">|</span>
  <span><span class="k">video</span> <span class="v" id="video">–</span></span>
  <span><span class="k">model</span> <span class="v" id="fmodel">–</span></span>
</div>
<div id="timeline">
  <div id="tltrack">
    <div id="tlwindow"></div>
    <div id="tlearlier"></div>
    <div id="tlfill"></div>
    <div id="tlstart"></div>
    <div id="tlhead"></div>
  </div>
  <div id="tllegend">
    <span id="tlfrom">–</span>
    <span class="mid" id="tlmid">–</span>
    <span id="tlto">–</span>
  </div>
</div>

<script>
  const view = document.getElementById('view');
  const paint = view.getContext('2d');
  const note = document.getElementById('note');

  // The frame we last finished drawing. The server holds the next one until it
  // hears this back, so the window can never fall behind the run -- inference
  // waits for the draw rather than queueing frames the volunteer never sees.
  let acknowledged = null;

  // Posted once, after the first real draw, as evidence the page rendered
  // rather than merely loaded. A blank window used to be indistinguishable
  // from a working one.
  let proofSent = false;

  // Palette by species. One colour per class name, so every red sea star on
  // screen is the same colour and a different colour means a different animal.
  //
  // This used to key on track id, which gave every individual its own colour:
  // useful for watching the tracker hold a box, useless for reading a frame.
  // Somebody watching wants to see at a glance that there are four of one thing
  // and one of another, and the tracker's identity is already in the label.
  //
  // Derived from the name rather than assigned in arrival order, so a species
  // keeps its colour across frames, across jobs, and across both machines --
  // order-based assignment gave the same animal a different colour in each
  // window, which is worse than no colour at all.
  function colourFor(className) {
    const name = String(className ?? 'unknown');
    let hash = 0;

    for (let i = 0; i < name.length; i += 1) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }

    // Golden-angle stride over the hash, which spreads neighbouring names far
    // apart on the wheel instead of into adjacent shades.
    const hue = (hash * 137.508) % 360;

    // Saturation and lightness are varied slightly, so two species that happen
    // to land on a similar hue are still told apart.
    const saturation = 78 + (hash % 3) * 7;
    const lightness = 58 + ((hash >> 3) % 3) * 6;

    return `hsl(${hue.toFixed(1)} ${saturation}% ${lightness}%)`;
  }

  // A frosted plate behind text, so a name stays readable over pale sand and
  // dark water alike without a solid block hiding the animal.
  //
  // Real blur rather than a flat wash: the region under the text is redrawn
  // through a blur filter and then dimmed very slightly. `filter` is reset
  // afterwards because it is sticky on a 2d context and would blur the video.
  function frostedPlate(x, y, width, height) {
    const pad = Math.max(3, view.width / 400);
    const left = x - pad;
    const top = y - pad;
    const boxW = width + pad * 2;
    const boxH = height + pad * 2;

    paint.save();
    paint.beginPath();
    const radius = Math.min(boxH / 2, Math.max(3, view.width / 300));
    paint.roundRect(left, top, boxW, boxH, radius);
    paint.clip();
    paint.filter = `blur(${Math.max(2, view.width / 500)}px)`;
    paint.drawImage(view, 0, 0);
    paint.filter = 'none';
    paint.fillStyle = 'rgba(0, 0, 0, 0.18)';
    paint.fillRect(left, top, boxW, boxH);
    paint.restore();
  }

  // One line of white text, centred on `centreX`, on its own frosted plate.
  function plateText(text, centreX, baselineY, pixels, weight) {
    paint.font = `${weight} ${pixels}px "Segoe UI", system-ui, sans-serif`;
    const width = paint.measureText(text).width;
    const left = centreX - width / 2;

    frostedPlate(left, baselineY - pixels, width, pixels * 1.18);
    // A shadow as well as the plate: over bright sand the plate alone is not
    // enough, and the shadow costs nothing where it is not needed.
    paint.shadowColor = 'rgba(0, 0, 0, 0.85)';
    paint.shadowBlur = Math.max(2, pixels / 6);
    paint.fillStyle = '#ffffff';
    paint.fillText(text, left, baselineY);
    paint.shadowBlur = 0;
    paint.shadowColor = 'transparent';
  }

  function drawTracks(tracks) {
    paint.lineWidth = Math.max(2, view.width / 480);
    paint.textBaseline = 'alphabetic';

    for (const track of tracks || []) {
      // bbox_normalized is [centre_x, centre_y, width, height], all 0..1 of
      // the frame, so it survives any scaling the canvas does.
      const [cx, cy, w, h] = track.bbox_normalized || [0, 0, 0, 0];
      const x = (cx - w / 2) * view.width;
      const y = (cy - h / 2) * view.height;
      const boxWidth = w * view.width;
      const boxHeight = h * view.height;
      const centreX = cx * view.width;

      paint.strokeStyle = colourFor(track.class_name);
      paint.strokeRect(x, y, boxWidth, boxHeight);

      // The name scales with the box, so a large animal is labelled large and a
      // distant one does not wear a label wider than itself. Bounded at both
      // ends: unreadable below about 12px, and a single close organism would
      // otherwise carry text across the whole frame.
      const namePixels = Math.round(
        Math.min(Math.max(boxWidth * 0.17, view.width / 90), view.width / 22));
      const detailPixels = Math.round(namePixels * 0.72);

      const name = String(track.class_name ?? 'unknown');
      const confidence = typeof track.confidence === 'number'
        ? track.confidence.toFixed(2) : null;
      // `track_id` is the tracker's identity for this animal across frames. It
      // is not an observation id -- observations do not exist until MARP
      // ingests the run -- so it is shown as a track and not mislabelled.
      const detail = confidence === null
        ? `#${track.track_id}` : `#${track.track_id} · ${confidence}`;

      // Name above the box, detail below it, both centred on the box. Flipped
      // when the box is near an edge, so a label never leaves the frame.
      const gap = Math.max(4, namePixels * 0.35);
      const nameAbove = y - gap > namePixels * 1.2;
      const detailBelow = y + boxHeight + gap + detailPixels < view.height;

      plateText(name, centreX,
        nameAbove ? y - gap : y + boxHeight + gap + namePixels, namePixels, 700);
      plateText(detail, centreX,
        detailBelow ? y + boxHeight + gap + detailPixels
                    : Math.max(detailPixels * 1.2, y - gap - namePixels * 1.2),
        detailPixels, 500);
    }
  }

  function updateBar(packet) {
    // The model name is not here: it is in the footer, and repeating it at the
    // top cost the space the frame rates now use.
    document.getElementById('job').textContent = packet.job_id ? `job ${packet.job_id}` : '';
    document.getElementById('frame').textContent = packet.frame_number;
    onScreen = (packet.tracks || []).length;
    renderDetections();

    // The timeline's fixed points ride on every frame rather than being
    // fetched once. The window can be opened, reloaded or re-tiled at any
    // moment in a job, and the packet is the only thing it is guaranteed to
    // get; a one-off handshake would leave a reloaded window with no axis.
    const { range_start: from, range_end: to } = packet;

    if (typeof from === 'number' && typeof to === 'number' && to > from) {
      span = {
        attemptStart: from,
        windowEnd: to,
        // Absent on a fresh job, and absent from a coordinator too old to
        // send it: then the job began where this attempt did, which is true.
        jobStart: typeof packet.job_start_frame === 'number'
          ? Math.min(packet.job_start_frame, from) : from,
        videoFrames: typeof packet.video_frames === 'number' ? packet.video_frames : null,
      };
    }

    playhead = packet.frame_number;
    drawTimeline();
  }


  // What the timeline is drawing. The axis comes from the frame packet and the
  // clock from `/status`, which arrive on different schedules, so both are kept
  // here and either one can trigger a redraw.
  let span = null;
  let playhead = null;
  let attemptElapsed = null;
  let attemptProgress = null;
  let windowedRate = null;

  // Seconds to something a person reads at a glance. Minutes above ninety
  // seconds, because an estimate that counts seconds down from an hour away is
  // precision the estimate does not have.
  function humanDuration(seconds) {
    if (typeof seconds !== 'number' || !isFinite(seconds) || seconds < 0) return null;
    if (seconds < 90) return `${Math.round(seconds)}s`;

    const minutes = Math.round(seconds / 60);

    if (minutes < 60) return `${minutes}m`;
    return `${Math.floor(minutes / 60)}h ${String(minutes % 60).padStart(2, '0')}m`;
  }

  // How long the rest of this job's window should take, in seconds.
  //
  // From the rolling rate in preference to the attempt's average, which is a
  // correction to what this was first specified as. `progress.elapsed_s` counts
  // from the moment the job process started, so the model load, the seek to the
  // range, and every second the volunteer held the job paused are all inside
  // it -- dividing by it understates the rate and inflates every estimate, most
  // on exactly the paused job somebody is looking at the window to understand.
  function remainingSeconds(now) {
    let rate = windowedRate !== null && windowedRate > 0 ? windowedRate : null;

    if (rate === null && attemptProgress) {
      const done = Number(attemptProgress.done) || 0;
      const elapsed = Number(attemptProgress.elapsed_s) || 0;

      // Only once there is enough of both to divide by.
      if (done > 0 && elapsed > 5) rate = done / elapsed;
    }

    if (!rate || !span) return null;
    return Math.max(0, span.windowEnd - now) / rate;
  }

  // Draw the bar: the video, the job's window inside it, what an earlier
  // attempt covered, what this one has covered, and where the playhead is.
  function drawTimeline() {
    if (!span) return;

    const { jobStart, attemptStart, windowEnd, videoFrames } = span;

    // The axis is the whole video when the container reported a length that can
    // contain the job. A stream that reports nothing, or a count smaller than
    // the range we were asked to process, is not trusted -- the axis is then
    // the job's own window, which is all this window can honestly draw.
    const wholeVideo = typeof videoFrames === 'number' && videoFrames >= windowEnd;
    const axisFrom = wholeVideo ? 0 : jobStart;
    const axisTo = wholeVideo ? videoFrames : windowEnd;
    const width = axisTo - axisFrom;

    if (!(width > 0)) return;

    const at = (frame) =>
      `${(Math.max(0, Math.min(1, (frame - axisFrom) / width)) * 100).toFixed(3)}%`;
    const place = (id, fromFrame, toFrame) => {
      const element = document.getElementById(id);
      element.style.left = at(fromFrame);
      element.style.width = `calc(${at(toFrame)} - ${at(fromFrame)})`;
    };

    // Never behind where this attempt began: a frame number from the previous
    // job, arriving one packet late, would otherwise drag the playhead back.
    const now = playhead === null ? attemptStart : Math.max(attemptStart, playhead);

    place('tlwindow', jobStart, windowEnd);
    place('tlearlier', jobStart, attemptStart);
    place('tlfill', attemptStart, now);
    document.getElementById('tlhead').style.left = at(now);

    // The tick only means something when there is earlier work to divide from
    // this attempt's; on a fresh job it would sit on the playhead's own start
    // and read as a second playhead.
    const resumed = attemptStart > jobStart;
    const startTick = document.getElementById('tlstart');

    startTick.style.display = resumed ? 'block' : 'none';
    startTick.style.left = at(attemptStart);

    setText('tlfrom', grouped(axisFrom));
    setText('tlto', grouped(axisTo));

    // Through the job, not through this attempt. Somebody who picks up a job
    // that is already half done should see it half done.
    const throughJob = (now - jobStart) / Math.max(1, windowEnd - jobStart);
    const parts = [
      `frame ${grouped(now)}`,
      `${Math.round(Math.max(0, Math.min(1, throughJob)) * 100)}% of this job`,
    ];

    // Said in words as well as drawn, because the one reading somebody must
    // not come away with is that the job skipped these frames.
    if (resumed) parts.push(`resumed at ${grouped(attemptStart)}`);

    const elapsed = humanDuration(attemptElapsed);

    if (elapsed) parts.push(`${elapsed} elapsed`);

    const left = humanDuration(remainingSeconds(now));

    // Omitted rather than guessed at. A paused job has no rate, and inventing
    // one would put a number on screen that only moves away from the truth.
    if (left) parts.push(`~${left} left`);

    setText('tlmid', parts.join(' · '));
  }

  async function show(packet) {
    const image = new Image();
    // Decoded before drawing so the canvas is never resized around a
    // half-loaded bitmap, which showed as a one-frame flicker.
    image.src = `data:${packet.content_type};base64,${packet.image}`;
    await image.decode();

    if (view.width !== image.naturalWidth || view.height !== image.naturalHeight) {
      view.width = image.naturalWidth;
      view.height = image.naturalHeight;
    }
    paint.drawImage(image, 0, 0);
    drawTracks(packet.tracks);
    // Which job this window is drawing. Declared far above and, until now,
    // never assigned -- so every window matched the first job in `/status`.
    if (packet.attempt_id) attemptId = packet.attempt_id;
    updateBar(packet);
    note.hidden = true;

    drawnAnything = true;

    if (!proofSent) {
      proofSent = true;
      // Best effort: the run must not depend on the proof being accepted.
      view.toBlob(
        (blob) => blob && fetch('/render-proof', { method: 'POST', body: blob }).catch(() => {}),
        'image/jpeg',
        0.8,
      );
    }
  }

  // Whether this window has ever drawn a frame. A failure before the first one
  // is a real fault worth leaving on screen; after it, the server going away is
  // just the job ending.
  let drawnAnything = false;

  // End of the run: close the window.
  //
  // A watched job leaves nothing behind. The worker also kills the browser, but
  // it cannot always: Chromium may hand the window to another process and exit,
  // and the pid the worker holds is then gone while the window lives on. So the
  // page closes itself as well, and whichever gets there first wins.
  function finish(message) {
    note.textContent = message;
    note.hidden = false;

    try {
      window.close();
    } catch { /* blocked: the message stays up instead */ }

    // `window.close()` is refused for a window a script did not open, on some
    // builds and some launch modes. Say plainly that it can be closed, rather
    // than leaving a stale frame that looks like a stuck job.
    setTimeout(() => { note.textContent = `${message} — this window can be closed`; }, 1500);
  }

  // How long a broken `/next` is tolerated before the window gives up, and how
  // long to wait between attempts. Thirty seconds is far longer than any
  // dropped connection and far shorter than a job, so a window that stays dark
  // is a window whose worker has really gone.
  const PUMP_GIVE_UP_MS = 30000;
  const PUMP_RETRY_MS = 500;

  // When the pump last had a frame. The give-up clock runs from here, not from
  // the first failure, so a burst of drops is one outage rather than several.
  let lastGoodAt = Date.now();

  async function pump() {
    // One request at a time, forever. `/next` long-polls, so this is not a
    // spin -- it blocks in the server until there is a frame to hand over.
    for (;;) {
      try {
        const response = await fetch('/next', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ acknowledged_frame: acknowledged }),
        });

        // 204 is the channel closing: the job has finished or the worker has
        // detached the display.
        if (response.status === 204) {
          finish('the run has finished');
          return;
        }
        if (!response.ok) throw new Error(`/next answered ${response.status}`);

        const packet = await response.json();
        await show(packet);
        acknowledged = packet.frame_number;
        lastGoodAt = Date.now();
      } catch (error) {
        // A failed fetch is not proof the job ended.
        //
        // This used to close the window on the first one, on the reasoning that
        // `close()` shuts the channel and the server together so a failed fetch
        // and a clean 204 mean the same thing. They do not. `/next` long-polls
        // with no server-side deadline, so an idle connection can be dropped by
        // the stack at any moment -- and the window then closed itself minutes
        // into a job that ran on for another eight. Measured on ABYSS on
        // 2026-09-21: every attempt lost its window between thirteen seconds and
        // six minutes in, each one logged as `exit code 0` because the browser
        // had shut down cleanly when the page asked it to.
        //
        // So retry, and let the server's absence prove itself. A job that has
        // really ended refuses the connection immediately, so the retries cost
        // no time; a dropped long-poll reconnects and the window keeps drawing.
        if (drawnAnything && Date.now() - lastGoodAt < PUMP_GIVE_UP_MS) {
          note.textContent = 'reconnecting to the worker...';
          note.hidden = false;
          await new Promise((wake) => setTimeout(wake, PUMP_RETRY_MS));
          continue;
        }

        finish(drawnAnything
          ? 'the run has finished'
          : `display stopped: ${error.message}`);
        return;
      }
    }
  }

  // Where the worker's own API is listening.
  //
  // The display server and the worker API are two servers on two ports, so the
  // page has to be told. `?api=` is passed when the window is launched; 8010 is
  // the worker's default and the right fallback for a single-worker machine.
  // CORS on the worker API already allows any loopback origin, which is what
  // makes this reachable at all.
  const apiPort = new URLSearchParams(location.search).get('api') || '8010';
  const apiBase = `http://127.0.0.1:${apiPort}`;

  // The attempt this window belongs to, learned from the first packet. A
  // machine running several slots has several jobs in `/status`, and the wrong
  // one's dive name is worse than none.
  let attemptId = null;

  // Frames-per-second, measured over a window rather than between two polls.
  //
  // Read from `/status`, not from frames drawn here: the display shows only the
  // most recent frame and skips the rest, so counting draws would report how
  // fast the window paints and call it inference. `progress.done` is frames the
  // engine actually finished.
  //
  // Ten seconds of history, because a two-second delta swings several f/s on
  // nothing -- a model load, a seek, a garbage collection -- and a number that
  // jumps is a number nobody can read.
  const RATE_WINDOW_MS = 10000;
  const rateHistory = [];

  // How many tracks are on this frame, and how many distinct animals this
  // machine has tracked since the worker started -- every slot, every job.
  //
  // The total counts each animal once, however many frames it was visible for,
  // which is why it comes from the worker rather than from adding up what this
  // window has drawn: a track lives across frames and only the engine holding
  // the tracker knows it is the same animal.
  let onScreen = 0;
  let machineTotal = null;

  // Grouped, because the total runs to millions within an hour and an
  // unseparated row of digits is not a number anybody can read at a glance.
  const grouped = (value) => value.toLocaleString('en-US');

  function renderDetections() {
    const noun = machineTotal === 1 && onScreen === 1 ? 'track' : 'tracks';
    document.getElementById('count').textContent =
      machineTotal === null
        ? `${onScreen} ${onScreen === 1 ? 'track' : 'tracks'}`
        : `${grouped(onScreen)} of ${grouped(machineTotal)} ${noun}`;
  }

  // Inputs: the `/status` jobs array. Output: {mine, all} in frames per second,
  // either null until there is enough history to divide by.
  function frameRates(jobs) {
    const now = Date.now();
    const done = {};

    for (const job of jobs) done[String(job.attempt_id)] = Number(job.progress.done) || 0;
    rateHistory.push({ at: now, done });

    while (rateHistory.length > 1 && now - rateHistory[0].at > RATE_WINDOW_MS) rateHistory.shift();

    const oldest = rateHistory[0];
    const seconds = (now - oldest.at) / 1000;

    // Under a second of history divides by almost nothing and produces a wild
    // number. Wait rather than show one.
    if (seconds < 1) return { mine: null, all: null };

    let all = 0;
    let mine = null;

    for (const [attempt, finished] of Object.entries(done)) {
      const before = oldest.done[attempt];

      // A slot that started since the oldest sample has no baseline, and one
      // whose counter went backwards has rolled onto a new job -- its frames
      // belong to a different range and counting them would invent progress.
      if (before === undefined || finished < before) continue;

      const rate = (finished - before) / seconds;
      all += rate;
      if (String(attempt) === String(attemptId)) mine = rate;
    }

    return { mine, all };
  }

  function setText(id, value) {
    document.getElementById(id).textContent =
      value === null || value === undefined || value === '' ? '–' : String(value);
  }

  // Bytes to something readable at a glance. Decimal units, because network
  // throughput is quoted that way and this sits beside a network figure.
  function humanBytes(bytes) {
    if (typeof bytes !== 'number' || !isFinite(bytes)) return null;
    const units = ['B', 'kB', 'MB', 'GB', 'TB'];
    let value = bytes;
    let unit = 0;

    while (value >= 1000 && unit < units.length - 1) {
      value /= 1000;
      unit += 1;
    }

    return `${value >= 100 || unit === 0 ? Math.round(value) : value.toFixed(1)} ${units[unit]}`;
  }

  // Refresh the footer from the worker's own API.
  //
  // Everything here is decoration, so every failure is swallowed and the field
  // keeps its last value. A window that stops drawing because a stats call
  // failed would be a worse bug than a stale megabyte count.
  async function refreshFooter() {
    try {
      const response = await fetch(`${apiBase}/system/resources`, { cache: 'no-store' });

      if (response.ok) {
        const resources = await response.json();
        const device = ((resources.nvidia || {}).devices || [])[0];

        if (device && typeof device.memory_used_bytes === 'number') {
          const used = humanBytes(device.memory_used_bytes);
          const total = humanBytes(device.memory_total_bytes);
          const percent = typeof device.memory_percent_used === 'number'
            ? ` (${Math.round(device.memory_percent_used)}%)` : '';
          setText('gpu', `${used} / ${total}${percent}`);
        }

        const network = resources.network || {};

        if (network.available) {
          // Averages since the previous sample, which is this page's own poll
          // interval. Null until there have been two readings.
          const down = humanBytes(network.received_bytes_per_second);
          const up = humanBytes(network.sent_bytes_per_second);
          setText('net', down && up ? `${down}/s down · ${up}/s up` : 'measuring…');
        }
      }
    } catch { /* decoration only */ }

    try {
      const response = await fetch(`${apiBase}/status`, { cache: 'no-store' });

      if (response.ok) {
        const status = await response.json();
        const jobs = status.active_jobs || [];

        // Match on the attempt this window is drawing, not simply the first
        // job: with several slots there are several, and they are different
        // videos in different sessions.
        const mine = attemptId === null
          ? jobs[0]
          : jobs.find((job) => String(job.attempt_id) === String(attemptId)) || null;

        if (typeof status.tracks_total === 'number') {
          machineTotal = status.tracks_total;
          renderDetections();
        }

        const rates = frameRates(jobs);

        // The same measurement the readout shows, kept for the estimate.
        windowedRate = rates.mine;
        setText('fps', rates.mine === null ? null : rates.mine.toFixed(1));
        setText('fpsall', rates.all === null ? null : rates.all.toFixed(1));

        if (mine) {
          const context = mine.session_context || {};
          setText('project', context.project);
          setText('dive', context.dive);
          setText('line', context.line);
          setText('stype', context.type);
          setText('video', mine.video_source);
          setText('fmodel', mine.model_name);

          // The clock half of the timeline. It is redrawn from here as well as
          // from each frame, so elapsed keeps counting on a job whose frames
          // arrive slowly -- or, while paused, do not arrive at all.
          attemptProgress = mine.progress || null;
          attemptElapsed = Number((mine.progress || {}).elapsed_s);
          drawTimeline();
        }
      }
    } catch { /* decoration only */ }
  }

  // Every two seconds. Often enough that a network figure means something,
  // rare enough that it never competes with the frame channel for the loopback.
  refreshFooter();
  setInterval(refreshFooter, 2000);

  pump();
</script>
